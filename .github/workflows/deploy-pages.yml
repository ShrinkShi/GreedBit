name: Deploy GreedBit to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish static site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate release
        shell: bash
        run: |
          set -euo pipefail
          node --test
          node tools/runtime-ownership.mjs
          node tools/check-version.mjs

      - name: Prepare site files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _site
          cp index.html _site/
          cp -R src styles assets _site/
          touch _site/.nojekyll
          test -s _site/index.html
          test -f _site/src/bootstrap.js
          test -f _site/styles/base.css
          test -f _site/assets/greedbit-logo.png

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static files
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
