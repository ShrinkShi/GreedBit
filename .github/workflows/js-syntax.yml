name: Runtime Integrity Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax recursively
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0 | sort -z)
      - name: Enforce runtime architecture
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          legacy_files=$(find src -maxdepth 1 -type f -regextype posix-extended -regex '.*/v[0-9]{3}.*\.js' -print)
          if [[ -n "$legacy_files" ]]; then
            echo "ERROR: legacy version scripts are forbidden:"
            echo "$legacy_files"
            fail=1
          fi

          if grep -R -nE 'src/v[0-9]{3}[^ ]*\.js' src index.html; then
            echo "ERROR: runtime still references legacy version scripts."
            fail=1
          fi

          if grep -R -nE 'syncPairLabel|syncExternalLabel|syncPairHeader' src; then
            echo "ERROR: retired shared-UI pollers returned."
            fail=1
          fi

          for asset in core market futures spot account ui bootstrap; do
            if ! grep -q "src/${asset}\.js?build=" index.html; then
              echo "ERROR: index entry script src/${asset}.js must carry a build cache key."
              fail=1
            fi
          done

          for stylesheet in base market trading assets overlays; do
            if ! grep -q "styles/${stylesheet}\.css?build=" index.html; then
              echo "ERROR: index stylesheet styles/${stylesheet}.css must carry a build cache key."
              fail=1
            fi
          done

          if grep -nE 'src/(core|market|futures|spot|account|ui|bootstrap)\.js["'"']' index.html; then
            echo "ERROR: unversioned entry scripts are forbidden because they can revive cached legacy runtime code."
            fail=1
          fi

          exit "$fail"
