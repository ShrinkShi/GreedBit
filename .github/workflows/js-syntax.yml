name: Runtime Integrity Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax recursively
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0 | sort -z)
      - name: Enforce runtime architecture
        shell: bash
        run: |
          set -euo pipefail
          fail=0

          legacy_files=$(find src -maxdepth 1 -type f -regextype posix-extended -regex '.*/v[0-9]{3}.*\.js' -print)
          if [[ -n "$legacy_files" ]]; then
            echo 'ERROR: legacy version scripts are forbidden:'
            echo "$legacy_files"
            fail=1
          fi

          if grep -R -n -E 'src/v[0-9]{3}[^"'"'"' ]*\.js' src index.html; then
            echo 'ERROR: runtime still references a legacy version-script path.'
            fail=1
          fi

          if grep -R -n -E 'syncPairLabel|syncExternalLabel|syncPairHeader' src; then
            echo 'ERROR: retired shared-UI pollers returned.'
            fail=1
          fi

          if grep -R -n -E 'document\.write\([^\n]*src/|createElement\(["'"']script["'"']\)[^\n]*v[0-9]{3}' src; then
            echo 'ERROR: a module is dynamically loading historical version scripts.'
            fail=1
          fi

          exit "$fail"
