name: JavaScript Syntax Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check JavaScript syntax recursively
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r -d '' file; do
            echo "Checking $file"
            node --check "$file"
          done < <(find src -type f -name '*.js' -print0 | sort -z)
      - name: Report legacy runtime references
        shell: bash
        run: |
          set -euo pipefail
          echo '--- version-script path references ---'
          grep -R -n -E 'src/v[0-9]{3}[^"'"'"' ]*\.js' src index.html || true
          echo '--- legacy shared-UI pollers ---'
          grep -R -n -E 'syncPairLabel|syncExternalLabel|syncPairHeader' src || true
